upstream visionserve_backend {
    server api:8000;
}

server {
    listen 80;
    server_name _;

    # Predictions/explanations accept image uploads -- backend's own cap
    # is 15MB (VISIONSERVE_MAX_UPLOAD_SIZE_BYTES); nginx's own default
    # (1MB) would reject those before they even reach the api container.
    client_max_body_size 20m;

    # Grad-CAM/Score-CAM/Occlusion can take a few seconds on CPU --
    # generous but bounded, so a genuinely stuck request doesn't hang
    # nginx workers forever.
    proxy_connect_timeout 5s;
    proxy_send_timeout    60s;
    proxy_read_timeout    60s;

    location / {
        proxy_pass http://visionserve_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Let the backend's own RequestIDMiddleware honor a caller-supplied
        # id if one was already set upstream of nginx; otherwise it
        # generates its own -- either way nginx doesn't need to invent one.
        proxy_set_header X-Request-ID      $request_id;
    }

    # Don't proxy interactive docs to the public internet by default.
    # Comment this out (or restrict by IP with `allow`/`deny`) if you
    # want /docs reachable through nginx too.
    location ~ ^/(docs|redoc|openapi\.json) {
        return 404;
    }
}
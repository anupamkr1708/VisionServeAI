services:
  api:
    build:
      context: .
      target: runtime
    image: visionserve-api:latest
    restart: unless-stopped
    env_file:
      - .env
    environment:
      VISIONSERVE_FAIL_FAST_ON_STARTUP: "true"
      UVICORN_WORKERS: "1"
      VISIONSERVE_TRUSTED_HOSTS: "*"
      VISIONSERVE_CORS_ORIGINS: "*"
    volumes:
      - ./logs:/app/logs
    networks:
      - visionserve_net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health/ready').status==200 else 1)"]
      interval: 30s
      timeout: 5s
      start_period: 90s
      retries: 3
    # ports:
    #   - "8000:8000"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/conf.d:/etc/nginx/conf.d:ro
    networks:
      - visionserve_net

  test:
    build:
      context: .
      target: test
    profiles: ["test"]
    networks:
      - visionserve_net

networks:
  visionserve_net:
    driver: bridge
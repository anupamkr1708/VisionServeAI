[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "visionserve-api"
version = "0.1.0"
description = "VisionServeAI - production deployment and serving layer for the chest X-ray multi-label classifier. Deployment-only: consumes frozen artifacts produced by the (separately archived) Sprint 01-04 research pipeline. Contains no training or evaluation code."
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["backend*", "inference*", "deployment*", "configs*"]
exclude = ["tests*", "docs*", "artifacts*", "scripts*"]

[tool.setuptools.package-data]
"*" = ["*.yaml", "*.yml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
disallow_untyped_defs = true
